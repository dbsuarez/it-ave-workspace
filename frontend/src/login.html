<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Avenue Workspace - Login</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="../src/styles.css">
<style>
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  .login-titlebar {
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: stretch;
    background: #2E0F3C;
    color: rgba(255,255,255,0.9);
    -webkit-app-region: drag;
    user-select: none;
  }
  .login-titlebar-title {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .login-titlebar-buttons {
    display: flex;
    -webkit-app-region: no-drag;
  }
  .login-win-btn {
    width: 44px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .login-win-btn:hover {
    background: rgba(255,255,255,0.14);
    color: #fff;
  }
  .login-win-btn.login-win-close:hover {
    background: #E81123;
    color: #fff;
  }
  .login-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    background: linear-gradient(135deg, #6B21A8 0%, #4C1D95 100%);
    padding: 16px 20px;
  }
  .login-card {
    background: #fff;
    border-radius: 12px;
    padding: 28px 32px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(107, 33, 168, 0.3);
  }
  .login-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .login-logo {
    display: block;
    margin: 0 auto 18px;
    object-fit: contain;
  }
  .login-header h1 {
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
    margin: 8px 0 4px;
  }
  .login-header p {
    color: var(--text-muted);
    font-size: 14px;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    box-sizing: border-box;
  }
  .form-group input:focus {
    border-color: var(--purple);
    outline: none;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary {
    background: var(--purple);
    color: #fff;
    margin-bottom: 16px;
  }
  .btn-primary:hover {
    background: var(--purple-dark);
  }
  .btn-secondary {
    background: var(--muted-bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: var(--border);
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--text-muted);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .error-msg {
    color: var(--danger);
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
    text-align: center;
  }
  .footer-note {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 20px;
  }
  .switch-link {
    color: var(--purple);
    cursor: pointer;
    font-weight: 600;
    text-decoration: none;
  }
  .switch-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="login-titlebar">
    <div class="login-titlebar-title">IT Avenue Workspace</div>
    <div class="login-titlebar-buttons">
      <button class="login-win-btn" id="login-win-min" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 12 12" width="12" height="12"><rect x="2" y="5.5" width="8" height="1" fill="currentColor"/></svg>
      </button>
      <button class="login-win-btn login-win-close" id="login-win-close" title="Close" aria-label="Close">
        <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5"/></svg>
      </button>
    </div>
  </div>
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <img class="login-logo" src="assets/icon-purple.png" alt="IT Avenue Workspace" width="72" height="72">
        <h1 id="auth-title">Sign in</h1>
        <p id="auth-subtitle">Welcome to IT Avenue Workspace</p>
      </div>

      <div id="error-msg" class="error-msg"></div>

      <form id="auth-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <div class="form-group" id="invite-row" hidden>
          <label for="invite-code" id="invite-label">Invitation code (optional)</label>
          <input type="text" id="invite-code" placeholder="xxxx-xxxx-xxxx" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary" id="auth-btn">Sign in</button>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <button type="button" class="btn btn-secondary" id="switch-btn">Create an account</button>

      <div class="footer-note">
        IT Avenue Workspace runs on your own server. No cloud, no per-user fees.
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
