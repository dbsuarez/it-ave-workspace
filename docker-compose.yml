# IT Avenue Workspace - Docker Compose (development)
# Run: docker-compose up -d

version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: itavenue-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - itavenue_db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: itavenue-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-}
      BACKEND_PORT: ${BACKEND_PORT}
      FRONTEND_URL: ${FRONTEND_URL}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB}
      UPLOAD_DIR: ${UPLOAD_DIR}
      WEBRTC_ICE_SERVERS: ${WEBRTC_ICE_SERVERS:-}
    ports:
      - "3001:3001"
    volumes:
      - itavenue_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  itavenue_db_data:
  itavenue_uploads: