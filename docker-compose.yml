# IT Avenue Workspace - Docker Compose (development)
# Run: docker-compose up -d

services:
  db:
    image: postgres:15-alpine
    container_name: itavenue-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - itavenue_db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    ports:
      # Bound to this machine only; the backend reaches the database over the Docker network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: itavenue-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      ALLOW_PASSWORDLESS_SIGNIN: ${ALLOW_PASSWORDLESS_SIGNIN:-false}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-}
      BACKEND_PORT: ${BACKEND_PORT}
      FRONTEND_URL: ${FRONTEND_URL}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB}
      UPLOAD_DIR: ${UPLOAD_DIR}
      WEBRTC_ICE_SERVERS: ${WEBRTC_ICE_SERVERS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-Asia/Manila}
      LOG_REQUESTS: ${LOG_REQUESTS:-true}
    ports:
      # Set BACKEND_BIND=127.0.0.1 when the TLS proxy is in front, so only the proxy can reach the backend.
      - "${BACKEND_BIND:-0.0.0.0}:3001:3001"
    volumes:
      - itavenue_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # ---- Optional services (start with: docker compose --profile <name> up -d <service>) ----

  # Scheduled backups of the database and uploaded files into ./backups (profile "backup").
  backup:
    image: postgres:15-alpine
    container_name: itavenue-backup
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - itavenue_uploads:/uploads:ro
      - ./deploy/backup.sh:/backup.sh:ro
    command: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # HTTPS in front of the backend, with automatic certificates (profile "tls").
  proxy:
    image: caddy:2-alpine
    container_name: itavenue-proxy
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      LOCAL_SITE_ADDRESSES: ${LOCAL_SITE_ADDRESSES:-https://localhost}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  # A TURN relay so calls work across restrictive networks (profile "turn"). Needs a Linux host with a public
  # address: it uses host networking for its UDP relay range (open 3478 and 49160-49200 in the firewall).
  turn:
    image: coturn/coturn:4.6
    container_name: itavenue-turn
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--no-cli"
      - "--realm=${TURN_REALM:-itavenue}"
      - "--external-ip=${TURN_EXTERNAL_IP:-}"
      - "--user=${TURN_USER:-}:${TURN_PASSWORD:-}"
      - "--min-port=49160"
      - "--max-port=49200"

volumes:
  itavenue_db_data:
  itavenue_uploads:
  caddy_data:
  caddy_config:
